name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check backend dependency lock
        run: python scripts/check_lock.py
      - name: Install dependencies
        run: pip install -r plantcare_web/backend/requirements.lock pytest
      - name: Run tests
        run: python -m pytest plantcare_web/tests -q

  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plantcare_web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plantcare_web/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci
      - name: Install preview server dependencies
        run: python -m pip install -r ../backend/requirements.lock
      - name: Check translation catalogs
        working-directory: .
        run: node scripts/check_i18n.mjs
      - name: Type-check and build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium --only-shell
      - name: Run browser and accessibility tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: plantcare_web/frontend/test-results/
          if-no-files-found: ignore
