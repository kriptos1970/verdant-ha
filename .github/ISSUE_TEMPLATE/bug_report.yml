name: Bug report
description: Report something that does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include credentials, Home Assistant tokens, personal archives or photos from a real collection.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Collection and plants
        - Care round and calendar
        - Treatments and products
        - Sensors and Home Assistant integration
        - AI advice
        - Import, backup and restore
        - Photos and health album
        - Botanicals and identification
        - Mobile layout
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Add-on version
      placeholder: "0.10.3"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Home Assistant version, browser, device, and whether the add-on is used through Ingress.
      placeholder: "HA 2026.x, Safari, iPhone 17 Pro, Ingress"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove tokens, URLs with credentials and personal data before pasting.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed credentials and personal data from the report.
          required: true
