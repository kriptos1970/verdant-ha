name: Verdant
version: "0.11.24"
slug: plantcare_web
description: Verdant — plants, care rounds and botanical assistant with a local archive
url: https://github.com/kriptos1970/verdant-ha
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:flower
panel_title: Verdant
panel_admin: true
map:
  - type: share
    read_only: false
options:
  language: auto
  photo_directory: /data/photos
  max_photo_mb: 20
  measurement_retention_days: 365
  timezone: Europe/Rome
  exposed_entities: []
  poll_interval_minutes: 15
  care_engine_mode: active
  ai_provider: none
  ai_model: ""
  openai_api_key: ""
  gemini_api_key: ""
  ai_update_time: "03:00"
  auto_apply_ai: false
  plantnet_api_key: ""
  perenual_api_key: ""
  openplantbook_client_id: ""
  openplantbook_secret: ""
schema:
  language: list(auto|it|en)
  photo_directory: str
  max_photo_mb: int(1,100)
  measurement_retention_days: int(7,3650)
  timezone: str
  exposed_entities:
    - str
  poll_interval_minutes: int(1,1440)
  care_engine_mode: list(shadow|active)
  ai_provider: list(none|gemini|openai)
  ai_model: str?
  openai_api_key: password?
  gemini_api_key: password?
  ai_update_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  auto_apply_ai: bool
  plantnet_api_key: password?
  perenual_api_key: password?
  openplantbook_client_id: password?
  openplantbook_secret: password?
